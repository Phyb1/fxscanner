[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxscanner"
version = "0.1.0"
description = "Trend-pullback forex scanner with broker-agnostic MT5 adapter"
requires-python = ">=3.11"
dependencies = ["python-decouple>=3.8"]

[project.optional-dependencies]
mt5 = ["MetaTrader5"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
fxscan = "fxscanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "decouple"
ignore_missing_imports = true
